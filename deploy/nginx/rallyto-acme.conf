# Temporary, while the first certificates are issued: port 80 only, ACME challenge, nothing else. The final vhosts point
# at certificate files that do not exist until then. Removed once they are installed (docs/DEPLOYMENT.md).
server {
    listen 80;
    listen [::]:80;
    server_name rallyto.ir www.rallyto.ir admin.rallyto.ir api.rallyto.ir app.rallyto.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
