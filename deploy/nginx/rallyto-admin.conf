# Nginx vhost for the Rallyto admin panel on the shared server. Install: docs/DEPLOYMENT.md.

server {
    listen 80;
    listen [::]:80;
    server_name admin.rallyto.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.rallyto.ir;

    ssl_certificate /etc/letsencrypt/live/admin.rallyto.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.rallyto.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex" always;

    root /var/www/rallyto/admin;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # A single-page app: every route is index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
