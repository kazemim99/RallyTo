# Nginx vhost for the Rallyto API on the shared server. The API container listens on loopback only. Install:
# docs/DEPLOYMENT.md.

server {
    listen 80;
    listen [::]:80;
    server_name api.rallyto.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rallyto.ir;

    ssl_certificate /etc/letsencrypt/live/api.rallyto.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rallyto.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex" always;

    # Photo uploads are at most 10 MB (VenueImageFile.MaxBytes).
    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, not appended: a client cannot plant its own address (ProxyHeaders).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR's websocket.
    location /hubs/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
