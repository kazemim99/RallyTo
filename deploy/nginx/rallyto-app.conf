# app.rallyto.ir has no content of its own yet: it sends visitors to the site, keeping the path, so a share link still
# works. A temporary redirect (302), because a web build of the player app may live here later. Install:
# docs/DEPLOYMENT.md.

server {
    listen 80;
    listen [::]:80;
    server_name app.rallyto.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.rallyto.ir;

    ssl_certificate /etc/letsencrypt/live/app.rallyto.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.rallyto.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        return 302 https://rallyto.ir$request_uri;
    }
}
