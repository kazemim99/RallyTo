# app.rallyto.ir: the web build of the player app (rallyto-app/web), installable from the browser; on iPhone it is the
# way to use Rallyto. Install: docs/DEPLOYMENT.md.

server {
    listen 80;
    listen [::]:80;
    server_name app.rallyto.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.rallyto.ir;

    ssl_certificate /etc/letsencrypt/live/app.rallyto.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.rallyto.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Flutter's file names carry no hash, so every file is checked again on each visit (a 304 when unchanged).
    add_header Cache-Control "no-cache" always;

    root /var/www/rallyto/app;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json application/wasm image/svg+xml font/ttf;
    gzip_min_length 1024;

    # Share links are served on the site, by the API.
    location /m/ {
        return 302 https://rallyto.ir$request_uri;
    }

    location = /manifest.json {
        types { application/manifest+json json; }
    }

    # The app routes in the browser: an address that is not a file is the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
