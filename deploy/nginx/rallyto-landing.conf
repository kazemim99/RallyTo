# Nginx vhost for the Rallyto site on the shared server. It claims only rallyto.ir, so it never competes with the other
# sites' Host-header routing. Install: docs/DEPLOYMENT.md.

server {
    listen 80;
    listen [::]:80;
    server_name rallyto.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rallyto.ir;

    ssl_certificate /etc/letsencrypt/live/rallyto.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rallyto.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/rallyto/landing;
    index index.html;
    charset utf-8;
    gzip_static on;

    # /tennis is tennis.html; a Persian path is the same, nginx decodes $uri (Astro build.format: file). Only the home
    # page is a directory: an exact match, so /clubs/تهران finds its .html beside the folder of the same name.
    location = / {
        try_files /index.html =404;
    }

    # One URL for the home page. Safe from loops: the try_files above serves index.html in place, it does not redirect.
    location = /index.html {
        return 301 /;
    }

    location / {
        try_files $uri $uri.html =404;
    }
    error_page 404 /404.html;

    # Hashed file names, safe to keep for a year. add_header here replaces the server's, so they are repeated.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The Android app for direct download. It lives outside the site's folder, so publishing the site keeps it
    # (deploy/publish-landing.sh swaps that folder whole); deploy/publish-app.sh puts it there.
    location = /download/rallyto.apk {
        alias /var/www/rallyto/downloads/rallyto.apk;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="rallyto.apk"';
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Share links are served by the API.
    location /m/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, not appended: a client cannot plant its own address (ProxyHeaders).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# www.rallyto.ir has no content of its own: one permanent redirect to the canonical host, keeping the path.
server {
    listen 80;
    listen [::]:80;
    server_name www.rallyto.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://rallyto.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rallyto.ir;

    ssl_certificate /etc/letsencrypt/live/www.rallyto.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.rallyto.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        return 301 https://rallyto.ir$request_uri;
    }
}
