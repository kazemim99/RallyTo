# Development stack. Host ports differ from AsanRezerve's so both can run side by side.
name: rallyto

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rallyto
      POSTGRES_USER: rallyto
      POSTGRES_PASSWORD: rallyto_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rallyto -d rallyto"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rallyto-network]

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [rallyto-network]

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5342:80"
    networks: [rallyto-network]

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rallyto.local
      PGADMIN_DEFAULT_PASSWORD: rallyto_dev
    ports:
      - "5051:80"
    depends_on: [postgres]
    networks: [rallyto-network]

  rallyto-api:
    build:
      context: .
      dockerfile: src/Host/Rallyto.Host/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=rallyto;Username=rallyto;Password=rallyto_dev
      ConnectionStrings__Redis: redis:6379
      Seq__ServerUrl: http://seq:80
      OTP_SANDBOX_CODE: "1234"
    ports:
      - "5100:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [rallyto-network]

volumes:
  postgres-data:
  uploads:

networks:
  rallyto-network:
