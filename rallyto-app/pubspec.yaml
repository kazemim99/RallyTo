name: rallyto_app
description: Rallyto (رالیتو) - find a partner for tennis, padel, badminton and squash.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # API & networking
  dio: ^5.11.1
  retrofit: ^4.10.0
  json_annotation: ^4.12.0

  # Local storage
  flutter_secure_storage: ^11.2.0

  # Navigation
  go_router: ^18.1.1

  # Jalali calendar
  shamsi_date: ^1.1.1

  # Dependency injection
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Functional programming (Either<Failure, T>)
  dartz: ^0.10.1

  # OTP entry: segmented code field, and Android SMS User Consent autofill. pinput stays on 6.x: 7.x moved to
  # package:material_ui, and this app still builds on package:flutter/material.dart.
  pinput: ^6.0.2
  smart_auth: ^3.2.0

  # Venue detail map: OpenStreetMap tiles with only the club's marker. The player's location is never requested.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Profile photo: gallery or camera, downscaled on the device (maxWidth/maxHeight/imageQuality) before upload.
  image_picker: ^1.2.3

  # Realtime: the single SignalR hub `/hubs/realtime` for chat and inbox events while the app is in the foreground.
  signalr_netcore: ^1.4.4

  # Push: FCM. `android/app/google-services.json` is supplied at build time and never committed; without it the app
  # runs with push turned off.
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

  # The system share sheet, for a public game's share link.
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.15.1
  retrofit_generator: ^10.3.2
  json_serializable: ^6.15.2
  injectable_generator: ^3.1.3

  # Linting
  flutter_lints: ^6.0.0

  # Deterministic timers in cubit tests (search debounce).
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/vazir/Vazir.ttf
        - asset: assets/fonts/vazir/Vazir-Bold.ttf
          weight: 700
        - asset: assets/fonts/vazir/Vazir-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazir/Vazir-Light.ttf
          weight: 300
        - asset: assets/fonts/vazir/Vazir-Thin.ttf
          weight: 100
